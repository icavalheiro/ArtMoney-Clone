name: Release Windows executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17" # Android Gradle Plugin 8.5.x requires Java 17+
          cache: gradle

      - name: Build Windows executable
        shell: pwsh
        run: .\gradlew.bat :composeApp:packageReleaseExe --stacktrace

      - name: Find generated executable
        id: find_exe
        shell: pwsh
        run: |
          # Compose output directories differ between plugin versions, so check both known layouts.
          $artifactDirectories = @(
            "composeApp/build/compose/binaries/main/release/exe",
            "composeApp/build/compose/binaries/main-release/exe"
          ) | Where-Object { Test-Path $_ }

          if (-not $artifactDirectories) {
            throw "No Compose Windows release output directory was found."
          }

          $executables = Get-ChildItem -Path $artifactDirectories -File -Filter *.exe

          if ($executables.Count -ne 1) {
            throw "Expected exactly one release executable, found $($executables.Count)."
          }

          $exe = $executables[0]

          "exe_path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "exe_name=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_exe.outputs.exe_path }}
          generate_release_notes: true
