name: Release Windows executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build Windows executable
        shell: pwsh
        run: .\gradlew.bat :composeApp:packageReleaseExe

      - name: Find generated executable
        id: find_exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "composeApp/build/compose/binaries" -Recurse -File -Filter *.exe |
            Where-Object { $_.FullName -match '[\\/]exe[\\/]' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $exe) {
            throw "No release executable was generated."
          }

          "exe_path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "exe_name=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_exe.outputs.exe_path }}
          generate_release_notes: true
